<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Hidden Achievements</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=DM+Sans:wght@500;700&family=Lilita+One&family=Nunito:wght@600;800&family=Press+Start+2P&family=Young+Serif&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="style.css">
</head>
<body data-theme="garden">

	 <div id="shell">
		 <header id="topbar">
			 <h1>Hidden Achievements</h1>
			 <div id="topbar-tools">
				 <div id="progress">
					 <span id="progress-count">0 found</span>
					 <span id="progress-bar"><span id="progress-fill"></span></span>
				 </div>
				 <div id="theme-switch" role="group" aria-label="Theme">
					 <button type="button" data-theme="garden" aria-pressed="true">Garden</button>
					 <button type="button" data-theme="pixel" aria-pressed="false">Pixel</button>
					 <button type="button" data-theme="pop" aria-pressed="false">Pop</button>
					 <button type="button" data-theme="clean" aria-pressed="false">Clean</button>
				 </div>
			 </div>
		 </header>

		 <div id ="display" >
		 		<canvas id="myCanvas"></canvas>
			  <div id= "achievement-area">
			  	<h2>Achievements</h2>
			  	<p class="panel-hint">Names stay hidden until you find them.</p>
			  </div>
			  <div id="toast-area"></div>
		 </div>
	 </div>
  	<script src="src/static.js"></script>
	 <script src="src/achievement.js"></script>
	 <script src="src/particleEngine.js"></script>

		<script src="src/UI.js"></script>
		<script src="p5.js"></script>
	  <script src="addons/p5.sound.min.js"></script>

	  <script src="src/audioEngine.js"></script>
		<script src="src/player.js"></script>
		<script src="src/terrain.js"></script>
		<script src="src/camera.js"></script>
		<script src="src/toaster.js"></script>
		<script src="src/skin.js"></script>

		<script src="script.js"></script>
</body>
</html>
